<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统状态测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status-box { 
            border: 1px solid #ccc; 
            padding: 20px; 
            margin: 10px 0; 
            border-radius: 5px; 
            background: #f9f9f9; 
        }
        .status-indicator { 
            display: inline-block; 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            margin-right: 8px; 
        }
        .status-online { background-color: #28a745; }
        .status-warning { background-color: #ffc107; }
        .status-offline { background-color: #dc3545; }
        button { 
            padding: 10px 20px; 
            margin: 5px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .json-display { 
            background: #f8f9fa; 
            border: 1px solid #e9ecef; 
            padding: 15px; 
            border-radius: 4px; 
            font-family: monospace; 
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>
    <h1>🔧 系统状态测试页面</h1>
    
    <div class="status-box">
        <h2>📊 当前系统状态</h2>
        
        <div id="statusDisplay">
            <p><span class="status-indicator" id="httpIndicator"></span>HTTP服务器: <span id="httpStatus">检查中...</span></p>
            <p><span class="status-indicator" id="llamaIndicator"></span>LLaMA服务: <span id="llamaStatus">检查中...</span></p>
            <p><span class="status-indicator" id="dbIndicator"></span>数据库: <span id="dbStatus">检查中...</span></p>
            <p>🕐 运行时间: <span id="uptime">--</span></p>
            <p>📊 数据库类型: <span id="dbType">--</span></p>
        </div>
        
        <button class="btn-primary" onclick="refreshStatus()">🔄 手动刷新状态</button>
        <button class="btn-success" onclick="startAutoRefresh()">⏱️ 开始自动刷新 (5秒)</button>
        <button class="btn-primary" onclick="stopAutoRefresh()">⏹️ 停止自动刷新</button>
    </div>
    
    <div class="status-box">
        <h2>🔍 API响应数据</h2>
        <div id="apiResponse" class="json-display">点击"刷新状态"获取数据...</div>
    </div>
    
    <div class="status-box">
        <h2>📝 测试日志</h2>
        <div id="testLog" class="json-display"></div>
    </div>

    <script>
        let autoRefreshInterval;
        
        function log(message) {
            const now = new Date().toLocaleTimeString();
            const logElement = document.getElementById('testLog');
            logElement.textContent += `[${now}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(message);
        }
        
        function formatUptime(startTimestamp) {
            const now = Math.floor(Date.now() / 1000);
            const diff = now - startTimestamp;
            const hours = Math.floor(diff / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;
            return `${hours}小时 ${minutes}分钟 ${seconds}秒`;
        }
        
        async function refreshStatus() {
            try {
                log('正在获取系统状态...');
                const response = await fetch('/api/status');
                const data = await response.json();
                
                // 显示原始API响应
                document.getElementById('apiResponse').textContent = JSON.stringify(data, null, 2);
                
                // 更新HTTP服务器状态
                const httpIndicator = document.getElementById('httpIndicator');
                const httpStatus = document.getElementById('httpStatus');
                httpIndicator.className = 'status-indicator status-online';
                httpStatus.textContent = '运行正常';
                
                // 更新LLaMA服务状态
                const llamaIndicator = document.getElementById('llamaIndicator');
                const llamaStatus = document.getElementById('llamaStatus');
                if (data.llama_available) {
                    llamaIndicator.className = 'status-indicator status-online';
                    llamaStatus.textContent = '连接正常';
                } else {
                    llamaIndicator.className = 'status-indicator status-warning';
                    llamaStatus.textContent = '服务不可用';
                }
                
                // 更新数据库状态
                const dbIndicator = document.getElementById('dbIndicator');
                const dbStatus = document.getElementById('dbStatus');
                if (data.db_available) {
                    dbIndicator.className = 'status-indicator status-online';
                    dbStatus.textContent = '连接正常';
                } else {
                    dbIndicator.className = 'status-indicator status-offline';
                    dbStatus.textContent = '连接失败';
                }
                
                // 更新运行时间
                if (data.timestamp) {
                    const uptime = formatUptime(data.timestamp);
                    document.getElementById('uptime').textContent = uptime;
                    log(`服务器启动时间戳: ${data.timestamp}, 运行时间: ${uptime}`);
                }
                
                // 更新数据库类型
                document.getElementById('dbType').textContent = data.db_type || '未知';
                
                log('系统状态更新成功');
                
            } catch (error) {
                log(`获取状态失败: ${error.message}`);
                document.getElementById('httpStatus').textContent = '连接失败';
                document.getElementById('apiResponse').textContent = `错误: ${error.message}`;
            }
        }
        
        function startAutoRefresh() {
            log('开始自动刷新 (每5秒)');
            stopAutoRefresh(); // 先停止之前的定时器
            autoRefreshInterval = setInterval(refreshStatus, 5000);
        }
        
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                log('停止自动刷新');
            }
        }
        
        // 页面加载时自动获取一次状态
        document.addEventListener('DOMContentLoaded', function() {
            log('页面加载完成，开始初始状态检查');
            refreshStatus();
        });
    </script>
</body>
</html>
