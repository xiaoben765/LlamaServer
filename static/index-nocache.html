<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLaMA AI Assistant</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="/css/openwebui-style.css?v=1754399371">
    <link rel="stylesheet" href="/css/admin-modal.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar">
            <!-- 侧边栏头部 -->
            <div class="sidebar-header">
                <button class="sidebar-toggle" id="sidebar-toggle">
                    <svg class="sidebar-toggle-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" />
                    </svg>
                </button>
            </div>
            
            <!-- 侧边栏内容 -->
            <div class="sidebar-content">
                <!-- 新建对话按钮 -->
                <button class="new-chat-button" id="new-chat-btn">
                    <div class="new-chat-text">
                        <div class="logo-icon">L</div>
                        <span>新建对话</span>
                    </div>
                    <svg class="new-chat-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
                    </svg>
                </button>
                
                <!-- 搜索框 -->
                <div class="search-container">
                    <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                    <input type="text" class="search-input" placeholder="搜索对话..." id="search-input">
                </div>
                
                <!-- 对话历史 -->
                <div class="chat-history" id="chat-history">
                    <!-- 对话历史项将通过 JavaScript 动态生成 -->
                </div>
            </div>
            
            <!-- 侧边栏底部 -->
            <div class="sidebar-footer">
                <!-- 连接状态 -->
                <div class="connection-status">
                    <div class="status-indicator connecting" id="status-indicator"></div>
                    <span id="status-text">连接中...</span>
                </div>
                
                <!-- 用户菜单 -->
                <button class="user-menu" id="user-menu">
                    <div class="user-avatar">U</div>
                    <div class="user-info">
                        <div class="user-name">用户</div>
                    </div>
                    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <div class="navbar">
                <div class="navbar-content">
                    <div class="navbar-left">
                        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" style="display: none;">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" />
                            </svg>
                        </button>
                        <button class="mobile-sidebar-toggle" id="mobile-sidebar-toggle">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" />
                            </svg>
                        </button>
                    </div>
                    
                    <div class="navbar-center">
                        <select class="model-selector" id="model-selector">
                            <option value="">选择模型...</option>
                        </select>
                    </div>
                    
                    <div class="navbar-right">
                        <!-- 用户状态显示 -->
                        <div class="user-status" id="user-status" style="display: none;">
                            <span class="user-name" id="current-user-name">用户</span>
                            <button class="navbar-action" id="user-menu-btn" title="用户菜单">
                                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </button>
                        </div>
                        
                        <!-- 登录按钮 -->
                        <button class="navbar-action" id="login-btn" title="用户登录">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                            </svg>
                        </button>
                        
                        <button class="navbar-action" id="theme-toggle" title="切换主题">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                            </svg>
                        </button>
                        <button class="navbar-action" id="settings-btn" title="管理控制台">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 聊天区域 -->
            <div class="chat-area">
                <!-- 消息容器 -->
                <div class="messages-container" id="messages-container">
                    <!-- 占位内容 -->
                    <div class="placeholder-content" id="placeholder-content">
                        <div class="placeholder-logo">L</div>
                        <h1 class="placeholder-title">LLaMA AI Assistant</h1>
                        <p class="placeholder-description">我是 LLaMA AI 助手，很高兴为您服务。请输入您的问题，我将尽力为您提供帮助。</p>
                    </div>
                    
                    <!-- 消息列表 -->
                    <div id="messages-list"></div>
                </div>
                
                <!-- 输入区域 -->
                <div class="input-area">
                    <div class="input-container">
                        <div class="input-wrapper">
                            <textarea 
                                class="message-input" 
                                id="message-input" 
                                placeholder="输入您的消息..."
                                rows="1"
                                autofocus
                            ></textarea>
                            <div class="input-actions">
                                <button class="input-action" id="attach-btn" title="附件">
                                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13" />
                                    </svg>
                                </button>
                                <button class="input-action send" id="send-btn" title="发送">
                                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 移动端侧边栏遮罩 -->
    <div class="sidebar-overlay" id="sidebar-overlay" style="display: none;"></div>

    <!-- 用户登录弹窗 -->
    <div class="user-modal" id="auth-modal" style="display: none;">
        <div class="user-modal-overlay"></div>
        <div class="user-modal-content">
            <div class="user-modal-header">
                <h2 class="user-modal-title" id="auth-modal-title">🔑 用户登录</h2>
                <button class="user-modal-close">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="user-modal-body">
                <!-- 登录表单 -->
                <div class="auth-form" id="login-form">
                    <div class="form-group">
                        <label for="login-username">用户名</label>
                        <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
                    </div>
                    <div class="form-actions">
                        <button class="primary-btn" id="login-submit-btn">登录</button>
                        <button class="secondary-btn" id="switch-to-register">注册新账户</button>
                    </div>
                </div>
                
                <!-- 注册表单 -->
                <div class="auth-form" id="register-form" style="display: none;">
                    <div class="form-group">
                        <label for="register-username">用户名</label>
                        <input type="text" id="register-username" placeholder="请输入用户名（3-20字符）" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="register-password">密码</label>
                        <input type="password" id="register-password" placeholder="请输入密码（至少6位）" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">确认密码</label>
                        <input type="password" id="register-confirm-password" placeholder="请再次输入密码" autocomplete="new-password">
                    </div>
                    <div class="form-actions">
                        <button class="primary-btn" id="register-submit-btn">注册</button>
                        <button class="secondary-btn" id="switch-to-login">已有账户？登录</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 用户菜单弹窗 -->
    <div class="user-menu-dropdown" id="user-menu-dropdown" style="display: none;">
        <div class="user-menu-item" id="user-profile">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            个人信息
        </div>
        <div class="user-menu-item" id="user-logout">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            退出登录
        </div>
    </div>

    <!-- 管理控制台弹窗 -->
    <div class="admin-modal" id="admin-modal" style="display: none;">
        <div class="admin-modal-overlay"></div>
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h2 class="admin-modal-title">⚙️ 管理控制台</h2>
                <button class="admin-modal-close">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="admin-modal-body">
                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="status">
                        <span class="admin-tab-icon">📊</span>
                        系统状态
                    </button>
                    <button class="admin-tab" data-tab="cache">
                        <span class="admin-tab-icon">🗄️</span>
                        缓存管理
                    </button>
                    <button class="admin-tab" data-tab="database">
                        <span class="admin-tab-icon">🗃️</span>
                        数据库
                    </button>
                    <button class="admin-tab" data-tab="users">
                        <span class="admin-tab-icon">👥</span>
                        用户管理
                    </button>
                </div>
                
                <div class="admin-content">
                    <!-- 系统状态标签页 -->
                    <div class="admin-panel active" id="status-panel">
                        <div class="admin-section">
                            <h3 class="admin-section-title">🔍 服务状态监控</h3>
                            <div class="status-grid">
                                <div class="status-card">
                                    <div class="status-card-header">
                                        <span class="status-label">运行时间</span>
                                        <div class="status-indicator info"></div>
                                    </div>
                                    <div class="status-value" id="status-uptime">--</div>
                                </div>
                                
                                <div class="status-card">
                                    <div class="status-card-header">
                                        <span class="status-label">LLaMA服务</span>
                                        <div class="status-indicator online"></div>
                                    </div>
                                    <div class="status-value" id="status-requests">--</div>
                                </div>
                                
                                <div class="status-card">
                                    <div class="status-card-header">
                                        <span class="status-label">数据库</span>
                                        <div class="status-indicator online"></div>
                                    </div>
                                    <div class="status-value" id="status-connections">--</div>
                                </div>
                                
                                <div class="status-card">
                                    <div class="status-card-header">
                                        <span class="status-label">最后更新</span>
                                        <div class="status-indicator info"></div>
                                    </div>
                                    <div class="status-value" id="status-last-update">--</div>
                                </div>
                            </div>
                            
                            <div class="admin-actions">
                                <button class="admin-btn primary" id="refresh-status-btn">
                                    <span class="admin-btn-icon">🔄</span>
                                    刷新状态
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 缓存管理标签页 -->
                    <div class="admin-panel" id="cache-panel">
                        <div class="admin-section">
                            <h3 class="admin-section-title">🗄️ 缓存数据管理</h3>
                            <p class="admin-section-desc">管理系统缓存，清理临时数据以释放内存空间</p>
                            
                            <div class="admin-actions">
                                <button class="admin-btn warning" id="clear-cache-btn">
                                    <span class="admin-btn-icon">🧹</span>
                                    清理缓存
                                </button>
                                <button class="admin-btn primary" id="view-cache-btn">
                                    <span class="admin-btn-icon">👁️</span>
                                    查看缓存内容
                                </button>
                                <button class="admin-btn secondary" id="refresh-cache-btn">
                                    <span class="admin-btn-icon">🔄</span>
                                    刷新状态
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 数据库管理标签页 -->
                    <div class="admin-panel" id="database-panel">
                        <div class="admin-section">
                            <h3 class="admin-section-title">🗃️ 数据库管理</h3>
                            <p class="admin-section-desc">查看数据库统计信息和执行数据库操作</p>
                            
                            <div class="admin-actions">
                                <button class="admin-btn primary" id="database-stats-btn">
                                    <span class="admin-btn-icon">📊</span>
                                    数据库统计
                                </button>
                                <button class="admin-btn secondary" id="backup-db-btn">
                                    <span class="admin-btn-icon">�</span>
                                    备份数据库
                                </button>
                                <button class="admin-btn warning" id="optimize-db-btn">
                                    <span class="admin-btn-icon">⚡</span>
                                    优化数据库
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 用户管理标签页 -->
                    <div class="admin-panel" id="users-panel">
                        <div class="admin-section">
                            <h3 class="admin-section-title">👥 用户数据管理</h3>
                            <p class="admin-section-desc">查看用户统计及管理用户数据</p>
                            
                            <div class="admin-actions">
                                <button class="admin-btn primary" id="refresh-users-btn">
                                    <span class="admin-btn-icon">👁️</span>
                                    查看用户统计
                                </button>
                                <button class="admin-btn warning" id="delete-user-btn">
                                    <span class="admin-btn-icon">🗑️</span>
                                    删除指定用户
                                </button>
                                <button class="admin-btn danger" id="clear-users-btn">
                                    <span class="admin-btn-icon">�</span>
                                    清除所有用户
                                </button>
                            </div>
                        </div>
                    </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 管理控制台确认弹窗 -->
    <div class="admin-confirm-modal" id="admin-confirm-modal" style="display: none;">
        <div class="admin-confirm-overlay"></div>
        <div class="admin-confirm-content">
            <div class="admin-confirm-header">
                <h3 id="confirm-title">确认操作</h3>
            </div>
            <div class="admin-confirm-body">
                <p id="confirm-message">您确定要执行此操作吗？</p>
            </div>
            <div class="admin-confirm-actions">
                <button class="admin-btn danger" id="confirm-btn">确认</button>
                <button class="admin-btn secondary" id="cancel-btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 管理控制台信息弹窗 -->
    <div class="admin-info-modal" id="admin-info-modal" style="display: none;">
        <div class="admin-info-overlay"></div>
        <div class="admin-info-content">
            <div class="admin-info-header">
                <h3 id="info-title">信息</h3>
                <button class="admin-modal-close" id="info-close-btn">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="admin-info-body">
                <div id="info-text" class="admin-info-text"></div>
            </div>
            <div class="admin-info-actions">
                <button class="admin-btn primary" id="info-close-btn-footer">关闭</button>
            </div>
        </div>
    </div>

    <script src="/js/openwebui-app.js?v=1754399371"></script>
    <script src="/js/admin-console.js?v=1754399371"></script>
    <script src="/js/auth-manager.js?v=1754399371"></script>
    <script>
        // 初始化认证管理器
        const authManager = new AuthManager();
        
        // 初始化管理控制台并设置为全局变量
        window.adminConsole = new AdminConsole();

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面初始化完成');
            console.log('认证状态:', authManager.isLoggedIn() ? '已登录' : '未登录');
            
            if (authManager.isLoggedIn()) {
                console.log('当前用户:', authManager.getCurrentUser()?.username);
            }
        });
    </script>
</body>
</html>
