<!DOCTYPE html>
<html>
<head>
    <title>网络诊断</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border-left: 3px solid #ccc; }
        .success { border-color: green; }
        .error { border-color: red; }
        .loading { border-color: orange; }
    </style>
</head>
<body>
    <h1>LLaMA 服务器诊断</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(test, status, message) {
            const div = document.createElement('div');
            div.className = `test ${status}`;
            div.innerHTML = `<strong>${test}:</strong> ${message}`;
            results.appendChild(div);
        }
        
        // 测试主页
        addResult('主页测试', 'loading', '测试中...');
        fetch('/')
            .then(response => {
                if (response.ok) {
                    addResult('主页测试', 'success', `成功 (${response.status})`);
                } else {
                    addResult('主页测试', 'error', `失败 (${response.status})`);
                }
            })
            .catch(error => {
                addResult('主页测试', 'error', `网络错误: ${error.message}`);
            });
        
        // 测试 CSS
        addResult('CSS 测试', 'loading', '测试中...');
        fetch('/css/openwebui-style.css')
            .then(response => {
                if (response.ok) {
                    return response.text().then(text => {
                        addResult('CSS 测试', 'success', `成功 (${response.status}, ${text.length} 字节)`);
                    });
                } else {
                    addResult('CSS 测试', 'error', `失败 (${response.status})`);
                }
            })
            .catch(error => {
                addResult('CSS 测试', 'error', `网络错误: ${error.message}`);
            });
        
        // 测试 JS
        addResult('JS 测试', 'loading', '测试中...');
        fetch('/js/openwebui-app.js')
            .then(response => {
                if (response.ok) {
                    return response.text().then(text => {
                        addResult('JS 测试', 'success', `成功 (${response.status}, ${text.length} 字节)`);
                    });
                } else {
                    addResult('JS 测试', 'error', `失败 (${response.status})`);
                }
            })
            .catch(error => {
                addResult('JS 测试', 'error', `网络错误: ${error.message}`);
            });
        
        // 测试 API
        addResult('API 测试', 'loading', '测试中...');
        fetch('/api/status')
            .then(response => {
                if (response.ok) {
                    return response.json().then(data => {
                        addResult('API 测试', 'success', `成功 (${response.status}), 数据: ${JSON.stringify(data)}`);
                    });
                } else {
                    addResult('API 测试', 'error', `失败 (${response.status})`);
                }
            })
            .catch(error => {
                addResult('API 测试', 'error', `网络错误: ${error.message}`);
            });
    </script>
</body>
</html>
